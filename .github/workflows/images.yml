# Builds the app's image and the database backup's, and pushes them to GitHub's registry, tagged with the commit's
# sha (what the app stack's APP_VERSION names) and `latest`. Releasing is then changing APP_VERSION in Portainer.
name: images

on:
    push:
        # the production branch
        branches: [main]
    workflow_dispatch:

# actions pinned to commits, so a moved tag can't change what runs with the registry's credentials
permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - image: vest-visuals
                      context: .
                    - image: vest-visuals-backup
                      context: docker/backup
        steps:
            - uses: actions/checkout@v7

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
                  tags: |
                      type=sha,format=long,prefix=
                      type=raw,value=latest

            - uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.context }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
